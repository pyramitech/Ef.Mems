name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Ef.Mems.sln -c Release
      - run: dotnet test Ef.Mems.sln -c Release --no-build
      - name: Pack
        if: runner.os == 'Windows'
        run: dotnet pack src/Ef.Mems/Ef.Mems.csproj -c Release --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: packages
          path: artifacts/packages/*.*nupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet nuget push "packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
